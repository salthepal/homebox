# Fork-only workflow (salthepal/homebox `custom` branch).
# Builds the stock Dockerfile and publishes to GHCR only:
#   ghcr.io/salthepal/homebox:custom
#   ghcr.io/salthepal/homebox:custom-<shortsha>
# Kept separate from upstream's docker-publish.yaml so rebasing onto main never conflicts.
name: x / Docker (custom)

on:
  push:
    branches: [ "custom" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/x-docker.yml'
  workflow_dispatch:

concurrency:
  group: x-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Never run on upstream or other forks' copies of this file.
    if: github.repository == 'salthepal/homebox'
    runs-on: ubuntu-latest  # Unraid host is amd64; add arm64 here if ever needed.
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=custom
            type=sha,prefix=custom-,format=short

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache: no registry namespace needed (upstream used ghcr.io/sysadminsmedia/devcache).
          cache-from: type=gha,scope=x-docker
          cache-to: type=gha,scope=x-docker,mode=max,ignore-error=true
          build-args: |
            VERSION=custom-${{ github.sha }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
