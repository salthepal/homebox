# Fork-only: enforces the rebase contract (.fork/PLAN.md §2) on the custom branch.
name: x-seam-guard

on:
  push:
    branches: [ "custom" ]
  pull_request:
    branches: [ "custom" ]

permissions:
  contents: read

jobs:
  guard:
    if: github.repository == 'salthepal/homebox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Seam guard
        run: bash .fork/seam-guard.sh origin/main
